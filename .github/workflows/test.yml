name: Tests

# Runs tests/run.sh: builds the image as the publish workflow does (linux/amd64)
# and checks rendering (ODBC byte-identical to the original entrypoint), bad
# settings, the image's contents, and start-up in memory and ODBC modes.
#
# Not a gate: main.yml (the Docker Hub publish) neither waits for nor depends on
# this workflow. Check this run before merging or deploying a tag.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The ODBC comparison needs the pre-memory-storage commit (BASELINE_REF).
          fetch-depth: 0

      - name: tests/run.sh
        run: tests/run.sh
